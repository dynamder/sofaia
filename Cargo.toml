[workspace]
members = ["crates/ericed", "crates/sofaia"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.88"
publish = false

# One place for versions, on purpose: `ericed` and the app must resolve to the
# *same* iced_core/iced_widget copies, or `MouseArea` becomes two different
# types and every error message turns into nonsense.
[workspace.dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
iced_core = "0.14"
iced_widget = "0.14"
tokio = { version = "1.54.1", features = ["fs"] }
iced_test = "0.14"
png = "0.18"

ericed = { path = "crates/ericed" }
sofaia = { path = "crates/sofaia" }
