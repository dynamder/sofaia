[package]
name = "ericed"
description = "ERgonomic ICED: the parts every iced application writes again."
readme = "README.md"
keywords = ["iced", "gui", "widget", "style"]
categories = ["gui"]
edition.workspace = true
version.workspace = true
rust-version.workspace = true
# TODO(before publishing): add `license` and `repository`, then flip the
# workspace's `publish = false`.
publish.workspace = true

[dependencies]
iced_core.workspace = true
iced_widget.workspace = true
# Only `motion::frames` uses these: the frame subscription is a runtime concept,
# not a widget one.
iced_runtime.workspace = true
iced_futures.workspace = true
